<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>APAテスト</title>
</head>
<body>

<textarea id="inputText" style="width:100%;height:100px;">Svikle, M. Ya. (1976) Control of the Colorado beetle. Zashchita Rastenii (6): 10-11</textarea><br>
<button onclick="convert()">変換</button>
<pre id="result" style="padding:10px; border:1px solid #ccc;"></pre>

<script>
function convert() {
  const input = document.getElementById("inputText").value.trim();
  const output = document.getElementById("result");

  const yearMatch = input.match(/\(\d{4}\)/);
  if (!yearMatch) {
    output.textContent = "年が見つかりません";
    return;
  }

  const yearIndex = input.indexOf(yearMatch[0]);
  const beforeYear = input.substring(0, yearIndex).trim();
  let afterYear = input.substring(yearIndex + yearMatch[0].length).trim();

  // 著者（1人だけの想定）
  const author = beforeYear;

  // 本文処理
  let after = afterYear
    .replace(/\((\d+)\):\s*([\d\-–]+)/, "$1: $2")  // ← これが重要
    .trim();

  if (!after.endsWith(".")) {
    after += ".";
  }

  const result = `${author} ${yearMatch[0]} ${after}`;
  output.textContent = result;
}
</script>

</body>
</html>
